default: &default
  encoding: utf8
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  adapter: mysql2
  username: root
  password:
  host: localhost
  database: furima-48464_development

test:
  <<: *default
  adapter: mysql2
  username: root
  password:
  host: localhost
  database: furima-48464_test

production:
  <<: *default
  adapter: mysql2
  database: furima-48464_production
  username: <%= ENV['DATABASE_USERNAME'] %>
  password: "<%= ENV['DATABASE_PASSWORD'] %>"
  socket: /var/lib/mysql/mysql.sock